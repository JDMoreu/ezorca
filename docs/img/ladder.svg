<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="ladder-title ladder-desc">
  <title id="ladder-title">Escalera de modelos de EzOrca</title>
  <desc id="ladder-desc">Cuatro escalones: económico o gratis, económico capaz, medio (p. ej., Codex medio, precio de salida ≤ US$12/M), y frontera que describe la solución sin escribir el código. Se sube tras dos fallos o antes por fallo crítico o riesgo. Empieza en el escalón que fija el selector; el nivel sale del precio, no del nombre. EzOrca avisa y sigue; pregunta solo antes de Opus o Codex alto, o si se pasa del presupuesto.</desc>
  <style>
    :root {
      --bg: #F4F6F8; --surface: #FFFFFF; --ink: #14213A; --muted: #5B6B82;
      --line: #D5DCE5; --accent: #1F6F8B; --accent-2: #C7861A;
      --good: #2E7D4F; --bad: #B23A3A; color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E1420; --surface: #151E2D; --ink: #E6ECF2; --muted: #9AA8BB;
        --line: #2A3547; --accent: #5DB3CF; --accent-2: #E0A445;
        --good: #5FBF86; --bad: #E07A7A; color-scheme: dark;
      }
    }
    text { font-family: Inter, Segoe UI, Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .title { font-size: 23px; font-weight: 600; }
    .box-title { font-size: 16px; font-weight: 600; }
    .label { font-size: 13px; }
    .small { font-size: 12px; }
  </style>
  <rect x="0" y="0" width="1120" height="500" fill="var(--bg)"/>
  <text class="title" x="32" y="42" fill="var(--ink)">Escalera de modelos</text>
  <text class="label" x="32" y="68" fill="var(--muted)">Más capacidad solo cuando la evidencia lo pide</text>
  <rect x="44" y="250" width="235" height="110" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="44" y="250" width="235" height="6" fill="var(--accent)"/>
  <text class="box-title" x="64" y="288" fill="var(--accent)">Económico / gratis</text>
  <text class="label" x="64" y="318" fill="var(--ink)">Primer escalón</text>
  <path d="M282 282 L296 282 L296 262 L308 262 L296 250 L284 262 L296 262" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <rect x="309" y="200" width="235" height="160" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="309" y="200" width="235" height="6" fill="var(--accent)"/>
  <text class="box-title" x="329" y="238" fill="var(--accent)">Económico capaz</text>
  <text class="label" x="329" y="268" fill="var(--ink)">Segundo escalón</text>
  <path d="M547 232 L561 232 L561 212 L573 212 L561 200 L549 212 L561 212" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <rect x="574" y="150" width="235" height="210" fill="var(--surface)" stroke="var(--muted)" stroke-width="2"/>
  <rect x="574" y="150" width="235" height="6" fill="var(--muted)"/>
  <text class="box-title" x="594" y="188" fill="var(--muted)">Medio</text>
  <text class="label" x="594" y="218" fill="var(--ink)">p. ej., Codex medio</text>
  <text class="small" x="594" y="240" fill="var(--muted)">precio de salida ≤ US$12/M</text>
  <path d="M812 182 L826 182 L826 162 L838 162 L826 150 L814 162 L826 162" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <rect x="839" y="100" width="235" height="260" fill="var(--surface)" stroke="var(--accent-2)" stroke-width="2"/>
  <rect x="839" y="100" width="235" height="6" fill="var(--accent-2)"/>
  <text class="box-title" x="859" y="138" fill="var(--accent-2)">Frontera</text>
  <text class="label" x="859" y="168" fill="var(--ink)">Describe la solución</text>
  <text class="label" x="859" y="194" fill="var(--ink)">No escribe el código</text>
  <text class="small" x="859" y="230" fill="var(--muted)">Opus / Codex alto:</text>
  <text class="small" x="859" y="250" fill="var(--muted)">pregunta antes.</text>
  <rect x="44" y="394" width="1030" height="76" fill="var(--surface)" stroke="var(--line)"/>
  <text class="label" x="64" y="414" fill="var(--ink)">Sube tras 2 fallos, o antes por fallo crítico o riesgo. Avisa y sigue.</text>
  <text class="label" x="64" y="436" fill="var(--ink)">Pregunta solo antes de Opus/Codex alto o si se pasa del presupuesto.</text>
  <text class="label" x="64" y="458" fill="var(--ink)">Empieza en el escalón que fija el selector; el nivel sale del precio, no del nombre.</text>
</svg>
